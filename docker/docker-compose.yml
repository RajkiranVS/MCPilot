# MCPilot — Docker Compose
# Production deployment on EC2 t3.small

version: '3.9'

services:

  # ── MCPilot API ─────────────────────────────────────────────────────────────
  mcpilot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcpilot-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://mcpilot:${DB_PASSWORD}@postgres:5432/mcpilot
      - SECRET_KEY=${SECRET_KEY}
      - AISSTREAM_API_KEY=${AISSTREAM_API_KEY}
      - LLM_PROVIDER=mock
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    networks:
      - mcpilot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: mcpilot-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mcpilot
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=mcpilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mcpilot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx reverse proxy + SSL ────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mcpilot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - mcpilot
    networks:
      - mcpilot-net

  # ── Certbot (SSL) ────────────────────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    container_name: mcpilot-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  certbot_www:
  certbot_conf:

networks:
  mcpilot-net:
    driver: bridge
