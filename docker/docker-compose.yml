# MCPilot — Docker Compose
# On-premise deployment — API, PostgreSQL and nginx (TLS) on a single host

version: '3.9'

services:

  # ── MCPilot API ─────────────────────────────────────────────────────────────
  mcpilot:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: mcpilot-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://mcpilot:${DB_PASSWORD}@postgres:5432/mcpilot
      - SECRET_KEY=${SECRET_KEY}
      - AISSTREAM_API_KEY=${AISSTREAM_API_KEY}
      - LLM_PROVIDER=mock
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
    networks:
      - mcpilot-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: mcpilot-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=mcpilot
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=mcpilot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mcpilot-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpilot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx reverse proxy + TLS ────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mcpilot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro   # your own certs: server.crt + server.key
    depends_on:
      - mcpilot
    networks:
      - mcpilot-net

volumes:
  postgres_data:

networks:
  mcpilot-net:
    driver: bridge
