worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 55M;

    server {
        listen 80;
        server_name api.mcpilot.in;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name api.mcpilot.in;

        ssl_certificate     /etc/letsencrypt/live/api.mcpilot.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.mcpilot.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "X-API-Key, Content-Type, Authorization";

        client_max_body_size 55M;

        location / {
            proxy_pass         http://mcpilot:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 300s;
        }
    }
}
