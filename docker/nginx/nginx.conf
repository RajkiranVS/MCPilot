worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    client_max_body_size 55M;

    server {
        listen 80;
        server_name api.mcpilot.in manyulogics.com www.manyulogics.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name api.mcpilot.in;
        ssl_certificate     /etc/letsencrypt/live/api.mcpilot.in-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.mcpilot.in-0001/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        client_max_body_size 55M;
        location / {
            proxy_pass         http://mcpilot:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }

    server {
        listen 443 ssl;
        server_name manyulogics.com www.manyulogics.com;
        ssl_certificate     /etc/letsencrypt/live/manyulogics.com-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/manyulogics.com-0001/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        location /frontend/ {
            proxy_pass http://mcpilot:8000/frontend/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass         http://mcpilot:8000/frontend/manyulogics.html;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
    }
}
