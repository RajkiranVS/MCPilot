# MCPilot — Nginx Configuration
# Reverse proxy for api.mcpilot.in

worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 55M;  # Allow 50MB file uploads

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # Gzip
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # HTTP → HTTPS redirect
    server {
        listen 80;
        server_name api.mcpilot.in mcpilot.in;

        # Certbot challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS — API
    server {
        listen 443 ssl;
        server_name api.mcpilot.in;

        ssl_certificate     /etc/letsencrypt/live/api.mcpilot.in/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.mcpilot.in/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000";

        # CORS for dashboard access
        add_header Access-Control-Allow-Origin "https://mcpilot.in";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "X-API-Key, Content-Type, Authorization";

        location / {
            limit_req zone=api burst=10 nodelay;
            proxy_pass         http://mcpilot:8000;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;  # Allow time for OCR
            proxy_send_timeout 120s;
        }
    }
}
